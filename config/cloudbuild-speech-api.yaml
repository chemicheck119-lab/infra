steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile.api
      - --build-arg=EMBED_WHISPER_MODEL=true
      - --build-arg=WHISPER_MODEL=small
      - --build-arg=VCS_REF=${_VCS_REF}
      - --build-arg=BUILD_DATE=${_BUILD_DATE}
      - --tag=${_IMAGE}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}
images:
  - ${_IMAGE}
timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _IMAGE: invalid.local/speech-api:unset
  _VCS_REF: unset
  _BUILD_DATE: unset
